---
- name: Install K3s backup prerequisite packages
  ansible.builtin.apt:
    name: "{{ k3s_backup_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
- name: Check whether the K3s backup path is already mounted
  ansible.builtin.command:
    argv:
      - mountpoint
      - --quiet
      - "{{ k3s_backup_mount_path }}"
  register: k3s_backup_mountpoint_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Create the K3s backup mount point
  ansible.builtin.file:
    path: "{{ k3s_backup_mount_path }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  when: k3s_backup_mountpoint_check.rc != 0

- name: Persist the K3s backup NFS export
  ansible.posix.mount:
    path: "{{ k3s_backup_mount_path }}"
    src: "{{ k3s_backup_nfs_server }}:{{ k3s_backup_nfs_export }}"
    fstype: nfs
    opts: "{{ k3s_backup_mount_options }}"
    state: present

- name: Reload systemd and activate the K3s backup automount
  ansible.builtin.systemd_service:
    name: 'mnt-k3s\x2dbackups.automount'
    daemon_reload: true
    state: started
