---
- name: Load K3s kernel modules
  ansible.builtin.systemd_service:
    name: systemd-modules-load.service
    state: restarted
  listen: Apply K3s kernel prerequisites

- name: Apply K3s sysctl settings
  ansible.builtin.command: /usr/sbin/sysctl --system
  changed_when: true
  listen: Apply K3s kernel prerequisites

- name: Restart K3s
  ansible.builtin.systemd_service:
    name: "{{ k3s_service_name }}"
    state: restarted
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode
  listen: Restart K3s
