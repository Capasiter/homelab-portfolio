---
linux_servers:
  children:
    development:
      hosts:
        ubuntu-dev-01:
          ansible_host: 192.0.2.10
          ansible_user: ansible

    k3s_cluster:
      vars:
        ansible_user: ansible
        ansible_ssh_common_args: >-
          -o ProxyJump=pve-k3s-bastion
      children:
        k3s_servers:
          hosts:
            k3s-server-01:
              ansible_host: 10.20.0.101
            k3s-server-02:
              ansible_host: 10.20.0.102
            k3s-server-03:
              ansible_host: 10.20.0.103
