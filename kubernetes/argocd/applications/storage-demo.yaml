---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Capasiter/homelab-portfolio.git
    targetRevision: main
    path: kubernetes/storage-demo
    directory:
      include: "*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: storage-demo
