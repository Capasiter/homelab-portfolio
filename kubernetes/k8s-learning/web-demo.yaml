---
apiVersion: v1
kind: Namespace
metadata:
  name: k8s-learning
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-demo
  namespace: k8s-learning
automountServiceAccountToken: false
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-demo
  namespace: k8s-learning
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: web-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-demo
  namespace: k8s-learning
  labels:
    app: web-demo
spec:
  replicas: 3
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web-demo
  template:
    metadata:
      labels:
        app: web-demo
    spec:
      automountServiceAccountToken: false
      serviceAccountName: web-demo
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          matchLabelKeys:
            - pod-template-hash
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: web-demo
      containers:
        - name: whoami
          image: traefik/whoami:v1.11.0
          env:
            - name: WHOAMI_PORT_NUMBER
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 2
          lifecycle:
            preStop:
              sleep:
                seconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web-demo
  namespace: k8s-learning
spec:
  type: ClusterIP
  selector:
    app: web-demo
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-demo
  namespace: k8s-learning
spec:
  ingressClassName: traefik
  rules:
    - host: web-demo.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-demo
                port:
                  number: 80
