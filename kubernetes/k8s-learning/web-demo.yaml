apiVersion: v1
kind: Namespace
metadata:
  name: k8s-learning
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-demo
  namespace: k8s-learning
  labels:
    app: web-demo
spec:
  replicas: 3
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web-demo
  template:
    metadata:
      labels:
        app: web-demo
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: whoami
          image: traefik/whoami:v1.11.0
          readinessProbe:
            httpGet:
              path: /
              port: 80
              scheme: HTTP
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 2
          lifecycle:
            preStop:
              sleep:
                seconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web-demo
  namespace: k8s-learning
spec:
  type: ClusterIP
  selector:
    app: web-demo
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-demo
  namespace: k8s-learning
spec:
  ingressClassName: traefik
  rules:
    - host: web-demo.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-demo
                port:
                  number: 80
