# kube-prometheus-stack chart version: 88.3.0
# Target cluster: K3s v1.36.2+k3s1
#
# Secrets are managed separately. Never place Grafana credentials,
# kubeconfig contents, tokens, or Kubernetes Secrets in this file.

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false

# These endpoints are reachable in the current K3s configuration.
kubeApiServer:
  enabled: true

kubelet:
  enabled: true

# These K3s component metrics endpoints listen only on localhost.
# Disabling their monitors prevents unreachable targets and false alerts.
kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

kubeEtcd:
  enabled: false

alertmanager:
  alertmanagerSpec:
    retention: 120h

    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi

  # ── Alert routing (G1: alert delivery) ──────────────────────────────────
  # Tiered severity routing via ntfy push notifications.
  #
  #   critical  → ntfy priority 5 (max/urgent, breaks through DND)
  #   warning   → ntfy priority 3 (default)
  #   info      → dropped (log-only, no push)
  #
  # The ntfy topic URL is the ONLY secret-ish value here. It is a random
  # string you choose at https://ntfy.sh (no account needed). Anyone who
  # knows the topic can read the alerts, so treat it like a password.
  #
  # To change the topic later: edit the url below, `helm upgrade`, done.
  config:
    route:
      receiver: ntfy-default
      group_by: [alertname, cluster, severity]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Critical: page immediately, no grouping delay
        - receiver: ntfy-critical
          matchers:
            - severity = critical
          group_wait: 10s
          repeat_interval: 1h
        # Warning: batch, lower urgency
        - receiver: ntfy-warning
          matchers:
            - severity = warning
          group_wait: 30s
          repeat_interval: 8h

    receivers:
      - name: ntfy-default
        ntfy_configs:
          - url: https://ntfy.sh/lee-homelab-8x7k2m
            title: '{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
            message: >-
              {{ range .Alerts }}
              {{ .Labels.instance }} — {{ .Annotations.description }}
              {{ end }}
            priority: 3
            tags: [bell]

      - name: ntfy-critical
        ntfy_configs:
          - url: https://ntfy.sh/lee-homelab-8x7k2m
            title: '🔴 CRITICAL: {{ .CommonLabels.alertname }}'
            message: >-
              {{ range .Alerts }}
              {{ .Labels.instance }} — {{ .Annotations.description }}
              {{ end }}
            priority: 5
            tags: [rotating_light, bell]

      - name: ntfy-warning
        ntfy_configs:
          - url: https://ntfy.sh/lee-homelab-8x7k2m
            title: '🟡 WARNING: {{ .CommonLabels.alertname }}'
            message: >-
              {{ range .Alerts }}
              {{ .Labels.instance }} — {{ .Annotations.description }}
              {{ end }}
            priority: 3
            tags: [warning]

grafana:
  admin:
    existingSecret: monitoring-grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  persistence:
    type: pvc
    enabled: true
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
    size: 2Gi

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  sidecar:
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi

prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 8GiB
    scrapeInterval: 30s
    evaluationInterval: 30s
    walCompression: true
    replicas: 1

    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1536Mi

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
