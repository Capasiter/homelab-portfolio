# kube-prometheus-stack chart version: 88.3.0
# Target cluster: K3s v1.36.2+k3s1
#
# Secrets are managed separately. Never place Grafana credentials,
# kubeconfig contents, tokens, or Kubernetes Secrets in this file.

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false

# These endpoints are reachable in the current K3s configuration.
kubeApiServer:
  enabled: true

kubelet:
  enabled: true

# These K3s component metrics endpoints listen only on localhost.
# Disabling their monitors prevents unreachable targets and false alerts.
kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

kubeEtcd:
  enabled: false

alertmanager:
  alertmanagerSpec:
    retention: 120h

    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi

  # ── Alert routing (G1: alert delivery) ──────────────────────────────────
  # Tiered severity routing via ntfy push notifications.
  #
  #   critical  → ntfy (urgent, breaks through DND)
  #   warning   → ntfy (default priority)
  #   info      → dropped (log-only, no push)
  #   Watchdog  → null receiver (see note below)
  #
  # The ntfy topic URL is the ONLY secret-ish value here. It is a random
  # string you choose at https://ntfy.sh (no account needed). Anyone who
  # knows the topic can read the alerts, so treat it like a password.
  #
  # To change the topic later: edit the url below, `helm upgrade`, done.
  #
  # ── Watchdog: why it goes to a null receiver ────────────────────────────
  # The kube-prometheus-stack ships a "Watchdog" alert with severity "none"
  # that fires *forever by design* — it is a pipeline self-test (a "dead
  # man's snitch") proving Prometheus → Alertmanager → a receiver works.
  # It is NOT a real incident. If it routed to ntfy it would re-push to the
  # phone every repeat_interval (4h) and spam Lee. So we route it to a
  # `null` receiver: Alertmanager still evaluates and records it (the pipeline
  # is still proven), but nothing is sent. Real critical + warning alerts
  # still page; info stays dropped.
  config:
    route:
      receiver: ntfy-default
      group_by: [alertname, cluster, severity]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Watchdog: always-firing pipeline test → swallow it (no push).
        # Listed first; Alertmanager routes are most-specific-first, and this
        # alertname is unique, so it unambiguously matches here.
        #
        # NOTE: the built-in `receiver: null` is dropped by the operator's
        # generator, so we use a named receiver `null` (defined below with no
        # webhook_configs) — Alertmanager accepts and discards it.
        - receiver: "null"
          matchers:
            - alertname = Watchdog
        # Critical: page immediately, no grouping delay
        - receiver: ntfy-critical
          matchers:
            - severity = critical
          group_wait: 10s
          repeat_interval: 1h
        # Warning: batch, lower urgency
        - receiver: ntfy-warning
          matchers:
            - severity = warning
          group_wait: 30s
          repeat_interval: 8h

    # Alertmanager has NO native ntfy_configs field. The standard, supported
    # mechanism is webhook_configs: Alertmanager POSTs its alert JSON to the
    # ntfy topic URL, and ntfy renders the notification. (ntfy_configs was an
    # invalid field and crashed Alertmanager 0.33.1 on load.)
    #
    # `null` is a named receiver with no webhook_configs — Alertmanager accepts
    # and discards notifications sent to it. (The built-in `receiver: null` is
    # dropped by the operator's generator, so we define a named one instead.)
    receivers:
      - name: "null"

      - name: ntfy-default
        webhook_configs:
          - url: https://ntfy.sh/lee-homelab-8x7k2m
            send_resolved: true

      - name: ntfy-critical
        webhook_configs:
          - url: https://ntfy.sh/lee-homelab-8x7k2m
            send_resolved: true

      - name: ntfy-warning
        webhook_configs:
          - url: https://ntfy.sh/lee-homelab-8x7k2m
            send_resolved: true

grafana:
  admin:
    existingSecret: monitoring-grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  persistence:
    type: pvc
    enabled: true
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
    size: 2Gi

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  sidecar:
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi

prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 8GiB
    scrapeInterval: 30s
    evaluationInterval: 30s
    walCompression: true
    replicas: 1

    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1536Mi

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
