---
apiVersion: v1
kind: Namespace
metadata:
  name: storage-demo
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: storage-demo-nfs
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: storage-demo
    name: storage-demo-data
  mountOptions:
    - nfsvers=3
    - hard
    - proto=tcp
  nfs:
    server: 192.168.0.102
    path: /mnt/user/k3s-app-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-demo-data
  namespace: storage-demo
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: storage-demo-nfs
  resources:
    requests:
      storage: 1Gi
