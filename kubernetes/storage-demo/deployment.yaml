---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-demo
  namespace: storage-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: storage-demo
  template:
    metadata:
      labels:
        app: storage-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 99
        runAsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: storage-demo
          image: busybox:1.37.0
          command: ["sh", "-c", "exec sleep infinity"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: application-data
              mountPath: /data
      volumes:
        - name: application-data
          persistentVolumeClaim:
            claimName: storage-demo-data
