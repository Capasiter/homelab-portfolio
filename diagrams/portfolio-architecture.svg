<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">Homelab infrastructure, in plain language</title>
  <desc id="desc">GitHub stores configuration. GitHub Actions checks it. OpenTofu and Ansible create and configure three Linux virtual machines on one physical Proxmox host. The machines run a Kubernetes cluster and sample services. Monitoring reports health and etcd backups are stored separately on Unraid. All three virtual machines share the same physical host.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#526579"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e6edf7}
      .title{font-size:30px;font-weight:700}.subtitle{font-size:16px;fill:#adbdce}
      .section{font-size:18px;font-weight:700}.label{font-size:16px;font-weight:650}.small{font-size:14px;fill:#c5d1df}
      .tiny{font-size:12px;fill:#b2c2d2}.white{fill:#fff}.host{fill:#121e2e;stroke:#70869c;stroke-width:2}
      .card{fill:#1b2939;stroke:#71869b;stroke-width:1.5}.blue{fill:#172c43;stroke:#74aaff}.green{fill:#18342b;stroke:#68c392}.purple{fill:#2b2140;stroke:#bb9aff}.amber{fill:#382d18;stroke:#efc66c}
      .line{fill:none;stroke:#9fb2c8;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="900" rx="20" fill="#0b1220"/>
  <text x="40" y="48" class="title">How the homelab works</text>
  <text x="40" y="76" class="subtitle">A quick map: write the plan → build the servers → run and monitor applications → protect recovery data</text>

  <rect x="40" y="105" width="260" height="112" rx="14" class="card blue"/>
  <text x="62" y="140" class="label">1 · GitHub</text>
  <text x="62" y="168" class="small">Stores server plans and</text><text x="62" y="188" class="small">application settings as files</text>

  <rect x="400" y="105" width="250" height="112" rx="14" class="card blue"/>
  <text x="422" y="140" class="label">2 · GitHub Actions</text>
  <text x="422" y="168" class="small">Checks the files for problems</text><text x="422" y="188" class="small">Does not deploy to the lab</text>

  <rect x="760" y="105" width="300" height="112" rx="14" class="card amber"/>
  <text x="782" y="140" class="label">3 · OpenTofu + Ansible</text>
  <text x="782" y="168" class="small">OpenTofu creates the virtual servers</text><text x="782" y="188" class="small">Ansible installs and configures software</text>

  <path d="M300 161H390" class="line"/>
  <path d="M300 185C480 260 700 230 800 218" class="line"/>

  <rect x="40" y="270" width="790" height="500" rx="20" class="host"/>
  <text x="66" y="310" class="section">One physical Proxmox computer</text>
  <text x="66" y="335" class="small">Proxmox runs the virtual machines (VMs)—separate computers hosted on one machine.</text>
  <path d="M900 217V250H420V260" class="line"/>

  <rect x="68" y="365" width="214" height="96" rx="12" class="card"/>
  <text x="88" y="397" class="label">Private lab network</text>
  <text x="88" y="423" class="small">OPNsense routes and</text><text x="88" y="443" class="small">protects internal traffic</text>

  <rect x="315" y="365" width="475" height="326" rx="16" fill="#101a29" stroke="#71869b" stroke-width="1.5"/>
  <text x="337" y="398" class="label">Kubernetes cluster (K3s)</text>
  <text x="337" y="421" class="small">Coordinates application containers across the three Linux VMs</text>

  <rect x="337" y="444" width="137" height="101" rx="11" class="card green"/>
  <text x="352" y="475" class="label">Server 01</text><text x="352" y="501" class="small">Runs K3s + etcd</text><text x="352" y="523" class="tiny">10.20.0.101</text>
  <rect x="484" y="444" width="137" height="101" rx="11" class="card green"/>
  <text x="499" y="475" class="label">Server 02</text><text x="499" y="501" class="small">Runs K3s + etcd</text><text x="499" y="523" class="tiny">10.20.0.102</text>
  <rect x="631" y="444" width="137" height="101" rx="11" class="card green"/>
  <text x="646" y="475" class="label">Server 03</text><text x="646" y="501" class="small">Runs K3s + etcd</text><text x="646" y="523" class="tiny">10.20.0.103</text>

  <rect x="337" y="566" width="431" height="94" rx="11" class="card blue"/>
  <text x="357" y="597" class="label">Stable Kubernetes API address</text>
  <text x="357" y="623" class="small">10.20.0.110 · Moves between server pods in a controlled test</text>
  <path d="M282 413H305" class="line"/>
  <path d="M542 545V557" class="line"/>

  <rect x="880" y="290" width="350" height="125" rx="14" class="card green"/>
  <text x="904" y="326" class="label">Applications</text>
  <text x="904" y="354" class="small">Argo CD applies reviewed app settings</text>
  <text x="904" y="378" class="small">WebDemo is the sample web application</text>
  <path d="M790 490H865" class="line"/>

  <rect x="880" y="445" width="350" height="125" rx="14" class="card blue"/>
  <text x="904" y="481" class="label">Monitoring</text>
  <text x="904" y="509" class="small">Prometheus collects health measurements</text>
  <text x="904" y="533" class="small">Grafana displays dashboards and alerts</text>
  <path d="M790 520H865" class="line"/>

  <rect x="880" y="600" width="350" height="125" rx="14" class="card purple"/>
  <text x="904" y="636" class="label">Separate recovery storage</text>
  <text x="904" y="664" class="small">Unraid stores off-server etcd snapshots</text>
  <text x="904" y="688" class="small">Integrity checks are documented</text>
  <path d="M790 625H865" class="line"/>

  <rect x="40" y="800" width="1190" height="64" rx="12" class="amber"/>
  <text x="64" y="827" class="label">Important boundary</text>
  <text x="64" y="849" class="small">All three VMs share this one physical host. A host failure can affect the whole cluster; full etcd restore testing is not yet complete.</text>
</svg>