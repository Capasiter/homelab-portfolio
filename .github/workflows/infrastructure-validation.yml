name: Infrastructure Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  opentofu:
    name: OpenTofu validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.4

      - name: Check formatting
        run: tofu fmt -check -recursive proxmox/opentofu

      - name: Initialize dev configuration
        working-directory: proxmox/opentofu/environments/dev
        run: tofu init -backend=false -input=false -lockfile=readonly

      - name: Validate dev configuration
        working-directory: proxmox/opentofu/environments/dev
        run: tofu validate -no-color

      - name: Initialize K3s configuration
        working-directory: proxmox/opentofu/environments/k3s
        run: tofu init -backend=false -input=false -lockfile=readonly

      - name: Validate K3s configuration
        working-directory: proxmox/opentofu/environments/k3s
        run: tofu validate -no-color

  ansible:
    name: Ansible validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ANSIBLE_CONFIG: ansible/ansible.cfg
      ANSIBLE_NOCOLOR: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ansible tooling
        run: python -m pip install ansible-core==2.16.3 ansible-lint==6.17.2

      - name: Install Ansible collections
        run: ansible-galaxy collection install --requirements-file ansible/requirements.yml

      - name: Validate sanitized inventory
        run: ansible-inventory -i ansible/inventory/hosts.example.yml --graph

      - name: Check Linux baseline playbook syntax
        run: ansible-playbook -i ansible/inventory/hosts.example.yml ansible/playbooks/linux_baseline.yml --syntax-check

      - name: Check K3s backup playbook syntax
        run: ansible-playbook -i ansible/inventory/hosts.example.yml ansible/playbooks/k3s_backup.yml --syntax-check

      - name: Check K3s cluster playbook syntax
        run: ansible-playbook -i ansible/inventory/hosts.example.yml ansible/playbooks/k3s_cluster.yml --syntax-check

      - name: Lint Ansible project
        run: ansible-lint --profile production ansible/

      - name: Lint K3s backup script
        run: shellcheck ansible/roles/k3s_backup/files/k3s-backup.sh

  observability:
    name: Kubernetes observability validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KUBECONFORM_VERSION: "0.8.0"
      KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
      KUBERNETES_SCHEMA_VERSION: "1.36.2"
      KUBERNETES_SCHEMA_COMMIT: "5a69f8365c9d3ed7de997f5365e22481cf775fa2"
      CRD_CATALOG_COMMIT: "7b1e26ef9deea49293714d204c1a2270aab1178f"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v4.2.4

      - name: Add Prometheus Community chart repository
        run: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts

      - name: Verify pinned chart version
        run: |
          helm show chart prometheus-community/kube-prometheus-stack \
            --version 88.3.0 |
            grep -qx 'version: 88.3.0'

      - name: Render pinned observability configuration
        run: |
          helm template monitoring prometheus-community/kube-prometheus-stack \
            --version 88.3.0 \
            --namespace monitoring \
            --include-crds \
            --values kubernetes/observability/kube-prometheus-stack-values.yaml \
            > /tmp/kube-prometheus-stack-rendered.yaml

      - name: Confirm rendered manifest is not empty
        run: test -s /tmp/kube-prometheus-stack-rendered.yaml

      - name: Install pinned Kubeconform
        run: |
          curl -fsSL \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            -o /tmp/kubeconform-linux-amd64.tar.gz
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform-linux-amd64.tar.gz" | sha256sum --check
          tar -xzf /tmp/kubeconform-linux-amd64.tar.gz -C /tmp kubeconform
          /tmp/kubeconform -v

      - name: Validate standalone Kubernetes manifests
        run: |
          /tmp/kubeconform \
            -kubernetes-version "${KUBERNETES_SCHEMA_VERSION}" \
            -strict \
            -summary \
            -schema-location "https://raw.githubusercontent.com/yannh/kubernetes-json-schema/${KUBERNETES_SCHEMA_COMMIT}/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json" \
            -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/${CRD_CATALOG_COMMIT}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            kubernetes/k8s-learning/web-demo.yaml \
            kubernetes/observability/namespace.yaml \
            kubernetes/observability/blackbox-exporter.yaml \
            kubernetes/observability/web-demo-availability.yaml
